name: Feature request
description: An idea or improvement for omastore
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas for this client. omastore is a terminal window onto the limehawk and HANCORE catalogs, then the official Omarchy CLI does the install — it is not a rival store.

        Security issues belong in [GitHub Security Advisories](https://github.com/antunesales-dev/omastore/security/advisories/new), not here. See [SECURITY.md](https://github.com/antunesales-dev/omastore/blob/main/SECURITY.md).

  - type: textarea
    id: idea
    attributes:
      label: What would you like
      description: What should omastore do that it does not do today?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does this solve for you?
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Extra notes
      description: Mockups, related issues, or how you would use it. Do not paste secrets, tokens, or personal data.
    validations:
      required: false
