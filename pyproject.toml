[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omastore"
version = "0.1.0"
description = "The Omarchy store in your terminal — search, preview, read, and install themes and plugins."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "omastore contributors" }]
keywords = ["omarchy", "tui", "themes", "plugins", "linux"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = ["textual>=2,<9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
omastore = "omastore.cli:main"

[project.urls]
Homepage = "https://github.com/antunesales-dev/omastore"
Source = "https://github.com/antunesales-dev/omastore"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omastore = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
